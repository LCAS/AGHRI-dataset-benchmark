device: 0
seed: 42
benchmark_fixed_input: true
benchmark_warmup: 20
benchmark_iters: 100
summary_primary_mode: bev
summary_primary_iou: 0.50
prefer_best_checkpoint: false
max_keep_ckpts: 1
project: 3d-detection/reports/benchmarks/mmdetection3d/runs
name: aghri-to-kitti-transfer
models:
  - name: pointpillars_aghri_to_kitti
    config: 3d-detection/benchmarks/mmdetection3d/configs/models/pointpillars_aghri_to_kitti.py
    train: false
    # Update this path to the best checkpoint from benchmark_mmdetection3d_aghri_pointpillars.
    # Pattern: runs/aghri-3d-detection/pointpillars_aghri/best_aghri_bev_ap_mean_epoch_<N>.pth
    checkpoint: 3d-detection/reports/benchmarks/mmdetection3d/runs/aghri-3d-detection/pointpillars_aghri/best_aghri_bev_ap_mean_epoch_80.pth
notes: >
  Zero-shot cross-dataset transfer: PointPillars trained on AGHRI, evaluated on
  KITTI without any fine-tuning. KITTI scans are clipped to AGHRI's range
  [-24, 30.4] x [-28, 28] before inference; effective range is [0, 30.4] x [-28, 28]
  since KITTI is forward-facing.
  Requires benchmark_mmdetection3d_aghri_pointpillars to be run first.
  Set KITTI_3D_DATA_ROOT=/workspace/data/kitti-3d when submitting (do NOT set
  AGHRI_3D_DATA_ROOT as it takes priority and would override the KITTI path).
