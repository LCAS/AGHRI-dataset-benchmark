device: 0
seed: 42
benchmark_fixed_input: true
benchmark_warmup: 20
benchmark_iters: 100
summary_primary_mode: 3d
summary_primary_iou: 0.50
prefer_best_checkpoint: true
save_best_metric: 3d_ap_mean
save_best_rule: greater
max_keep_ckpts: 3
project: 3d-detection/reports/benchmarks/mmdetection3d/runs
name: agri-human-3d-detection
models:
  - name: pointpillars_agrihuman
    config: 3d-detection/benchmarks/mmdetection3d/configs/models/pointpillars_agrihuman.py
  - name: second_agrihuman
    config: 3d-detection/benchmarks/mmdetection3d/configs/models/second_agrihuman.py
notes: "Benchmark settings for agri-human LiDAR 3D detection with PointPillars and SECOND. Reports IoU 0.25, 0.50, 0.75 and selects checkpoints by mean 3D AP across reported thresholds."
