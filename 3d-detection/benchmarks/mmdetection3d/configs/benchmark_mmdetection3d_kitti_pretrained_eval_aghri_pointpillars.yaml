device: 0
seed: 42
benchmark_fixed_input: true
benchmark_warmup: 20
benchmark_iters: 100
summary_primary_mode: bev
summary_primary_iou: 0.50
prefer_best_checkpoint: false
max_keep_ckpts: 1
project: 3d-detection/reports/benchmarks/mmdetection3d/runs
name: aghri-3d-detection-kitti-pretrained-zeroshot
models:
  - name: pointpillars_kitti_pretrained_eval_aghri
    config: 3d-detection/benchmarks/mmdetection3d/configs/models/pointpillars_kitti_pretrained_eval_aghri.py
    train: false
    # Public MMDetection3D KITTI 3-class PointPillars checkpoint — used as-is for
    # zero-shot evaluation on AGHRI. All weights (backbone, neck, head) load exactly
    # since the architecture is unchanged from the pretrained config. Pedestrian
    # predictions (class index 1 in [Car, Pedestrian, Cyclist]) are evaluated against
    # AGHRI "person" ground truth via Aghri3DMetric(pred_class_id=1).
    # Download before running:
    #   mim download mmdet3d \
    #     --config pointpillars_hv_secfpn_8xb6-160e_kitti-3d-3class \
    #     --dest 3d-detection/benchmarks/mmdetection3d/.cache/mim
    # Then update the filename below (mim appends a hash to the name).
    checkpoint: https://download.openmmlab.com/mmdetection3d/v1.0.0_models/pointpillars/hv_pointpillars_secfpn_6x8_160e_kitti-3d-3class/hv_pointpillars_secfpn_6x8_160e_kitti-3d-3class_20220301_150306-37dc2420.pth
notes: >
  Zero-shot evaluation: PointPillars public KITTI 3-class pretrained weights applied
  directly to AGHRI without any fine-tuning. AGHRI scans are clipped to the KITTI
  range [0, 69.12] x [-39.68, 39.68] (front hemisphere only) before inference.
  Pedestrian predictions (class 1) are matched against AGHRI "person" ground truth.
  Compare with benchmark_mmdetection3d_kitti_pretrained_aghri_pointpillars (fine-tuned)
  to quantify the benefit of fine-tuning on AGHRI data.
  Set AGHRI_3D_DATA_ROOT=/workspace/data/aghri-3d when submitting.
