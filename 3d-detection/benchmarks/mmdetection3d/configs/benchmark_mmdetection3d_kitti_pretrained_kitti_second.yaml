device: 0
seed: 42
benchmark_fixed_input: true
benchmark_warmup: 20
benchmark_iters: 100
summary_primary_mode: bev
summary_primary_iou: 0.50
prefer_best_checkpoint: true
save_best_metric: kitti/bev_ap_mean
save_best_rule: greater
max_keep_ckpts: 3
project: 3d-detection/reports/benchmarks/mmdetection3d/runs
name: kitti-3d-detection-kitti-pretrained
models:
  - name: second_kitti_pretrained_kitti
    config: 3d-detection/benchmarks/mmdetection3d/configs/models/second_kitti.py
    train: true
    # Public MMDetection3D KITTI 3-class SECOND checkpoint — used for weight
    # initialization only. The same KITTI spatial range and voxel grid means the
    # SparseEncoder backbone and SECONDFPN neck transfer fully (the best possible
    # transfer: same domain, same geometry, only class head changes). The anchor
    # head is re-initialized (3 classes → 1 person class).
    # Download before running:
    #   mim download mmdet3d \
    #     --config second_hv_secfpn_8xb6-80e_kitti-3d-3class \
    #     --dest 3d-detection/benchmarks/mmdetection3d/.cache/mim
    # Then update the filename below (mim appends a hash to the name).
    checkpoint: https://download.openmmlab.com/mmdetection3d/v1.1.0_models/second/second_hv_secfpn_8xb6-80e_kitti-3d-3class/second_hv_secfpn_8xb6-80e_kitti-3d-3class-b086d0a3.pth
notes: >
  Fine-tuning experiment: SECOND initialized from the public MMDetection3D KITTI
  3-class checkpoint and then fine-tuned on the KITTI person dataset. Since the
  spatial range and voxel grid are identical, the SparseEncoder backbone and
  SECONDFPN neck transfer completely — this is the most favorable transfer
  scenario (same domain, same geometry, only the class head changes).
  Analogous to ImageNet pretraining in 2D, but with domain-matched geometry.
  Compare with benchmark_mmdetection3d_kitti_second (from scratch) to quantify
  the benefit of the public pretraining.
  Set KITTI_3D_DATA_ROOT=/workspace/data/kitti-3d when submitting.
